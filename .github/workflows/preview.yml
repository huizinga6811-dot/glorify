name: Render previews

# Screenshots the site with headless Chrome and commits the renders to _preview/.
# Opt-in: only runs when the commit message contains [preview].

on:
  push:
    branches: ["claude/fervent-lovelace-hl8hyx"]

permissions:
  contents: write

jobs:
  preview:
    if: contains(github.event.head_commit.message, '[preview]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render screenshots
        run: |
          set -euo pipefail
          rm -rf _preview && mkdir -p _preview
          (cd "$RUNNER_TEMP" && npm init -y >/dev/null && npm install --no-audit --no-fund puppeteer-core >/dev/null)
          export CHROME_BIN="$(command -v google-chrome)"
          NODE_PATH="$RUNNER_TEMP/node_modules" node .github/preview.cjs
          ls -la _preview

      - name: Commit previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A _preview
          git commit -m "Render previews [skip ci]" || echo "nothing changed"
          git push
