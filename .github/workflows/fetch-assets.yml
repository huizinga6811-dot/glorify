name: Fetch campaign assets

on:
  push:
    branches: ["claude/fervent-lovelace-hl8hyx"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check whether assets already exist
        id: check
        run: |
          if [ -f assets/img/campaign-01.jpg ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download and optimize campaign imagery
        if: steps.check.outputs.skip == 'false'
        run: |
          set -euo pipefail
          command -v convert >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick; }
          mkdir -p assets/img tmp
          base="https://d8j0ntlcm91z4.cloudfront.net/user_3E8oIzuEcGg2Km3i39gc8uQJu3x"
          curl -fsSL --retry 3 -o tmp/c1.png "$base/hf_20260611_212501_f3ddba0b-f234-4ee9-af6a-e60c8c7586c2.png"
          curl -fsSL --retry 3 -o tmp/c2.png "$base/hf_20260611_212501_af81ce77-de0a-413c-adb6-bbec6b6b5e48.png"
          curl -fsSL --retry 3 -o tmp/c3.png "$base/hf_20260611_212501_4f8978a5-a8c5-47fe-857f-83ed6b7b9c57.png"
          for i in 1 2 3; do
            convert "tmp/c$i.png" -strip -interlace Plane -quality 84 "assets/img/campaign-0$i.jpg"
          done
          convert tmp/c1.png -strip -resize 1200x -gravity center -crop 1200x630+0+0 +repage -quality 80 assets/img/og.jpg
          rm -rf tmp
          ls -la assets/img

      - name: Commit assets back to the branch
        if: steps.check.outputs.skip == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img
          git commit -m "Add optimized campaign imagery [skip ci]"
          git push
